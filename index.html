<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Outbreak Run - الإصدار المصلح</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #111;
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  #game {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(to bottom, #1a1a2e 0%, #16213e 100%);
    border-bottom: 50px solid #333;
    box-sizing: border-box;
  }

  .player {
    width: 40px;
    height: 40px;
    background: cyan;
    position: absolute;
    bottom: 50px;
    left: 150px; /* مسافة أمان من العدو */
    border-radius: 5px;
    box-shadow: 0 0 10px cyan;
  }

  .enemy {
    width: 45px;
    height: 45px;
    background: #ff0055;
    position: absolute;
    bottom: 50px;
    left: 10px;
    border-radius: 5px;
    box-shadow: 0 0 15px #ff0055;
  }

  .mask {
    width: 25px;
    height: 25px;
    background: lime;
    position: absolute;
    bottom: 50px;
    border-radius: 50%;
  }

  .obstacle {
    width: 30px;
    height: 60px;
    background: #f0a500;
    position: absolute;
    bottom: 50px;
    border-radius: 3px;
  }

  #score {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 24px;
    font-weight: bold;
    z-index: 10;
  }

  .instructions {
    position: absolute;
    top: 60px;
    left: 20px;
    font-size: 14px;
    color: #aaa;
  }
</style>
</head>
<body>

<div id="game">
  <div id="score">Score: 0</div>
  <div class="instructions">اضغط أي مفتاح للقفز</div>
  <div class="player" id="player"></div>
  <div class="enemy" id="enemy"></div>
</div>

<script>
const playerElement = document.getElementById("player");
const enemyElement = document.getElementById("enemy");
const scoreText = document.getElementById("score");
const gameContainer = document.getElementById("game");

let y = 0;
let velocity = 0;
let gravity = -0.6;
let jumpPower = 13;

let speed = 5;
let score = 0;
let enemyPos = 10;

let masks = [];
let obstacles = [];

// التحكم بالقفز
document.addEventListener("keydown", () => {
  if (y === 0) velocity = jumpPower;
});

// لمس الشاشة للجوال
document.addEventListener("touchstart", () => {
  if (y === 0) velocity = jumpPower;
});

function createMask() {
  let m = document.createElement("div");
  m.className = "mask";
  m.style.left = "100vw";
  gameContainer.appendChild(m);
  masks.push(m);
}

function createObstacle() {
  let o = document.createElement("div");
  o.className = "obstacle";
  o.style.left = "100vw";
  gameContainer.appendChild(o);
  obstacles.push(o);
}

// إنشاء العناصر بشكل متكرر
setInterval(createMask, 4000);
setInterval(createObstacle, 2500);

function update() {
  // حركة الجاذبية للاعب
  velocity += gravity;
  y += velocity;

  if (y < 0) {
    y = 0;
    velocity = 0;
  }
  playerElement.style.bottom = (50 + y) + "px";

  // حركة الأقنعة (تزيد النقاط وتهدئ الوحش قليلاً)
  masks.forEach((m, i) => {
    let currentLeft = parseFloat(m.style.left);
    m.style.left = (currentLeft - speed) + "px";

    // تصادم مع القناع
    if (currentLeft < 190 && currentLeft > 150 && y < 30) {
      score += 100;
      enemyPos -= 20; // دفع العدو للخلف
      m.remove();
      masks.splice(i, 1);
    }
    // حذف العنصر إذا خرج من الشاشة
    if (currentLeft < -50) {
      m.remove();
      masks.splice(i, 1);
    }
  });

  // حركة العوائق
  obstacles.forEach((o, i) => {
    let currentLeft = parseFloat(o.style.left);
    o.style.left = (currentLeft - speed) + "px";

    // تصادم مع العائق (خسارة)
    if (currentLeft < 190 && currentLeft > 150 && y < 60) {
      gameOver("💀 صدمت عائقاً!");
    }

    if (currentLeft < -50) {
      o.remove();
      obstacles.splice(i, 1);
    }
  });

  // حركة العدو (المطاردة)
  // العدو يقترب ببطء مع مرور الوقت
  enemyPos += (speed * 0.15); 
  enemyElement.style.left = enemyPos + "px";

  // شرط الخسارة: إذا لمس العدو اللاعب
  if (enemyPos >= (150 - 40)) { 
    gameOver("🧟 الوحش مسكك!");
  }

  // زيادة النتيجة والصعوبة تدريجياً
  score++;
  speed += 0.001; 
  scoreText.innerText = "Score: " + score;

  requestAnimationFrame(update);
}

function gameOver(message) {
  alert(message + "\nScore: " + score);
  location.reload();
}

update();
</script>

</body>
</html>
