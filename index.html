<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Outbreak City - 3D Run</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: white; pointer-events: none; }
        #score { font-size: 30px; font-weight: bold; text-shadow: 2px 2px #ff0055; }
        #instructions { font-size: 14px; opacity: 0.8; }
        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <div id="score">SCORE: 0</div>
    <div id="instructions">المس يمين أو يسار لتتحرك</div>
</div>

<script>
let scene, camera, renderer, player, clock;
let obstacles = [], masks = [];
let score = 0, speed = 0.5, isGameOver = false;
let playerLane = 0; // -1: يسار, 0: منتصف, 1: يمين

init();
animate();

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020205);
    scene.fog = new THREE.Fog(0x020205, 10, 50);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 8);
    camera.lookAt(0, 0, -5);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // الإضاءة
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);
    const light = new THREE.DirectionalLight(0x00fbff, 0.8);
    light.position.set(0, 5, 5);
    scene.add(light);

    // الطريق (المدينة)
    const roadGeo = new THREE.PlaneGeometry(10, 1000);
    const roadMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    scene.add(road);

    // خطوط الطريق
    const grid = new THREE.GridHelper(10, 20, 0x00fbff, 0x222222);
    grid.position.y = 0.05;
    scene.add(grid);

    // اللاعب (على شكل إنسان مبسط)
    player = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1, 0.4), new THREE.MeshPhongMaterial({ color: 0x00fbff }));
    body.position.y = 1;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.25), new THREE.MeshPhongMaterial({ color: 0xffdbac }));
    head.position.y = 1.7;
    player.add(body, head);
    scene.add(player);

    clock = new THREE.Clock();

    // التحكم
    window.addEventListener('touchstart', (e) => {
        const x = e.touches[0].clientX;
        if (x < window.innerWidth / 2) movePlayer(-1);
        else movePlayer(1);
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === "ArrowLeft") movePlayer(-1);
        if (e.key === "ArrowRight") movePlayer(1);
    });
}

function movePlayer(dir) {
    playerLane = Math.max(-1, Math.min(1, playerLane + dir));
}

function spawnObstacle() {
    if (Math.random() > 0.96) {
        // بكتيريا أو عائق
        const isMask = Math.random() > 0.8;
        const geo = isMask ? new THREE.TorusGeometry(0.3, 0.1) : new THREE.SphereGeometry(0.5, 16, 16);
        const mat = new THREE.MeshPhongMaterial({ color: isMask ? 0x00ff00 : 0xff0055 });
        const obj = new THREE.Mesh(geo, mat);
        
        obj.position.set([-3, 0, 3][Math.floor(Math.random() * 3)], 0.5, -50);
        scene.add(obj);
        if (isMask) masks.push(obj); else obstacles.push(obj);
    }
}

function animate() {
    if (isGameOver) return;
    requestAnimationFrame(animate);

    // تحريك اللاعب بسلاسة بين المسارات
    player.position.x = THREE.MathUtils.lerp(player.position.x, playerLane * 3, 0.1);

    spawnObstacle();

    // تحريك العوائق (تأتي من الأمام)
    obstacles.forEach((o, i) => {
        o.position.z += speed;
        o.rotation.y += 0.05;
        
        // تصادم
        if (o.position.z > 7.5 && o.position.z < 8.5 && Math.abs(o.position.x - player.position.x) < 1) {
            endGame("أصابتك البكتيريا!");
        }
        if (o.position.z > 10) { scene.remove(o); obstacles.splice(i, 1); }
    });

    // تحريك الكمامات (الأقنعة)
    masks.forEach((m, i) => {
        m.position.z += speed;
        m.rotation.z += 0.1;
        if (m.position.z > 7.5 && m.position.z < 8.5 && Math.abs(m.position.x - player.position.x) < 1) {
            score += 100;
            scene.remove(m);
            masks.splice(i, 1);
        }
    });

    score++;
    speed += 0.0001;
    document.getElementById("score").innerText = "SCORE: " + score;

    renderer.render(scene, camera);
}

function endGame(msg) {
    isGameOver = true;
    alert(msg + "\nScore: " + score);
    location.reload();
}
</script>
</body>
</html>
