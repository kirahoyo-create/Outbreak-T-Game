<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hospital Run Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: white; pointer-events: none; z-index: 10; }
        #score { font-size: 40px; font-weight: bold; color: #00fbff; text-shadow: 0 0 15px #00fbff; }
        #shield-ui { color: #00ff00; font-size: 18px; display: none; margin-top: 10px; }
    </style>
</head>
<body>

<div id="ui">
    <div id="score">0</div>
    <div id="shield-ui">🛡️ SHIELD ACTIVE</div>
</div>

<script>
let scene, camera, renderer, player, clock;
let legL, legR, armL, armR;
let obstacles = [], boosts = [], deco = [];
let score = 0, speed = 0.7, lane = 0, targetX = 0;
let isGameOver = false, hasShield = false, isJumping = false, jumpV = 0;

init();
animate();

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);
    scene.fog = new THREE.Fog(0x050505, 10, 60);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 4, 12);
    camera.lookAt(0, 2, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    let sun = new THREE.DirectionalLight(0x00fbff, 1);
    sun.position.set(5, 10, 7);
    scene.add(sun);

    // بناء ممر المستشفى
    const floorGeo = new THREE.PlaneGeometry(12, 2000);
    const floorMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // بناء اللاعب (إنسان بمفاصل)
    player = new THREE.Group();
    const matSkin = new THREE.MeshPhongMaterial({ color: 0xffdbac });
    const matSuit = new THREE.MeshPhongMaterial({ color: 0x0055ff });

    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.5), matSuit);
    torso.position.y = 1.8;
    player.add(torso);

    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), matSkin);
    head.position.y = 2.7;
    player.add(head);

    legL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1, 0.3), matSuit);
    legL.position.set(-0.25, 0.5, 0);
    player.add(legL);

    legR = legL.clone();
    legR.position.x = 0.25;
    player.add(legR);

    armL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.9, 0.25), matSkin);
    armL.position.set(-0.55, 2, 0);
    player.add(armL);

    armR = armL.clone();
    armR.position.x = 0.55;
    player.add(armR);

    scene.add(player);

    // الدرع
    const sGeo = new THREE.SphereGeometry(1.8, 16, 16);
    const sMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true, transparent: true, opacity: 0.2 });
    player.shield = new THREE.Mesh(sGeo, sMat);
    player.shield.visible = false;
    player.add(player.shield);

    clock = new THREE.Clock();

    // التحكم (سحب أو أسهم)
    let startX = 0;
    window.addEventListener('touchstart', e => startX = e.touches[0].clientX);
    window.addEventListener('touchend', e => {
        let diff = e.changedTouches[0].clientX - startX;
        if (Math.abs(diff) > 30) moveLane(diff > 0 ? 1 : -1);
        else jumpAction();
    });
    window.addEventListener('keydown', e => {
        if (e.key === "ArrowLeft") moveLane(-1);
        if (e.key === "ArrowRight") moveLane(1);
        if (e.key === "ArrowUp") jumpAction();
    });
}

function moveLane(dir) {
    lane = Math.max(-1, Math.min(1, lane + dir));
    targetX = lane * 3.5;
}

function jumpAction() {
    if (!isJumping) { isJumping = true; jumpV = 0.25; }
}

function spawn() {
    if (Math.random() > 0.97) {
        const type = Math.random();
        if (type > 0.1) { // فايروس
            const geo = new THREE.IcosahedronGeometry(0.8, 1);
            const mat = new THREE.MeshPhongMaterial({ color: 0xff0044, wireframe: true });
            const obs = new THREE.Mesh(geo, mat);
            obs.position.set([-3.5, 0, 3.5][Math.floor(Math.random()*3)], 1, -60);
            scene.add(obs); obstacles.push(obs);
        } else { // كمامة (درع)
            const geo = new THREE.BoxGeometry(1, 0.5, 0.2);
            const mat = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
            const b = new THREE.Mesh(geo, mat);
            b.position.set([-3.5, 0, 3.5][Math.floor(Math.random()*3)], 1.5, -60);
            scene.add(b); boosts.push(b);
        }
    }
    // ديكور مستشفى (سرير)
    if (Math.random() > 0.98) {
        const bed = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 4), new THREE.MeshPhongMaterial({color:0xffffff}));
        bed.position.set(Math.random() > 0.5 ? -7 : 7, 0.5, -60);
        scene.add(bed); deco.push(bed);
    }
}

function animate() {
    if (isGameOver) return;
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    // فيزياء الحركة والقفز
    player.position.x += (targetX - player.position.x) * 0.2;
    if (isJumping) {
        player.position.y += jumpV;
        jumpV -= 0.015;
        if (player.position.y <= 0) { player.position.y = 0; isJumping = false; }
    }

    // أنيميشن الركض
    let wave = Math.sin(t * 12);
    legL.rotation.x = wave;
    legR.rotation.x = -wave;
    armL.rotation.x = -wave;
    armR.rotation.x = wave;

    spawn();

    // تحريك العناصر
    [obstacles, boosts, deco].forEach((list, idx) => {
        for(let i=list.length-1; i>=0; i--) {
            list[i].position.z += speed;
            if (idx < 2 && list[i].position.z > 10 && list[i].position.z < 12.5) {
                if (Math.abs(list[i].position.x - player.position.x) < 1.5 && player.position.y < 2) {
                    if (idx === 0) { // تصادم فايروس
                        if (hasShield) {
                            hasShield = false; player.shield.visible = false;
                            document.getElementById("shield-ui").style.display = "none";
                            scene.remove(list[i]); list.splice(i, 1);
                        } else endGame();
                    } else { // أخذ درع
                        hasShield = true; player.shield.visible = true;
                        document.getElementById("shield-ui").style.display = "block";
                        scene.remove(list[i]); list.splice(i, 1);
                    }
                }
            }
            if (list[i] && list[i].position.z > 20) { scene.remove(list[i]); list.splice(i,1); }
        }
    });

    score++;
    speed += 0.0001;
    document.getElementById("score").innerText = Math.floor(score/10);
    renderer.render(scene, camera);
}

function endGame() {
    isGameOver = true;
    alert("Game Over! Score: " + Math.floor(score/10));
    location.reload();
}
</script>
</body>
</html>
