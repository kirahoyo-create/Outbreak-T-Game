<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hospital Outbreak 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: white; pointer-events: none; z-index: 10; }
        #score { font-size: 35px; font-weight: bold; color: #00fbff; text-shadow: 0 0 10px rgba(0,251,255,0.5); }
        #shield-ui { font-size: 20px; color: #00ff00; display: none; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; margin: 10px auto; width: fit-content; }
        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <div id="score">SCORE: 0</div>
    <div id="shield-ui">🛡️ الدرع مُفعل (حماية +1)</div>
</div>

<script>
let scene, camera, renderer, player, clock;
let obstacles = [], boosts = [], decorations = [];
let score = 0, speed = 0.5, isGameOver = false, hasShield = false;
let playerLane = 0; 

// وظيفة لإنشاء نسيج من الإيموجي
function createEmojiTexture(emoji, size = 64) {
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.font = `${size*0.8}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, size/2, size/2);
    const texture = new THREE.CanvasTexture(canvas);
    return texture;
}

init();
animate();

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a12);
    scene.fog = new THREE.Fog(0x0a0a12, 5, 50);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 10);
    camera.lookAt(0, 1, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const spotLight = new THREE.SpotLight(0x00fbff, 1);
    spotLight.position.set(0, 20, 10);
    scene.add(spotLight);

    // أرضية المستشفى
    const floorGeo = new THREE.PlaneGeometry(15, 1000);
    const floorMat = new THREE.MeshPhongMaterial({ color: 0xeeeeee });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // جدران مع ديكورات مستشفى
    const wallGeo = new THREE.PlaneGeometry(1000, 10);
    const wallMat = new THREE.MeshPhongMaterial({ color: 0x99aabb, side: THREE.DoubleSide });
    const wallL = new THREE.Mesh(wallGeo, wallMat); 
    wallL.rotation.y = Math.PI/2; wallL.position.x = -7.5; wallL.position.y = 5;
    scene.add(wallL);
    const wallR = wallL.clone(); wallR.position.x = 7.5;
    scene.add(wallR);

    // صناعة شكل "الإنسان" الفعلي (باستخدام إيموجي)
    const playerGeo = new THREE.SpriteMaterial({ map: createEmojiTexture('🏃') });
    player = new THREE.Sprite(playerGeo);
    player.scale.set(2, 2, 1);
    player.position.y = 1;
    scene.add(player);

    // هالة الدرع
    const shieldGeo = new THREE.MeshBasicMaterial({ map: createEmojiTexture('🛡️'), transparent: true, opacity: 0.5 });
    player.shield = new THREE.Sprite(shieldGeo);
    player.shield.scale.set(3, 3, 1);
    player.shield.visible = false;
    player.add(player.shield);

    // التحكم
    window.addEventListener('touchstart', (e) => {
        const x = e.touches[0].clientX;
        if (x < window.innerWidth/2) movePlayer(-1); else movePlayer(1);
    });
    window.addEventListener('keydown', (e) => {
        if (e.key === "ArrowLeft") movePlayer(-1);
        if (e.key === "ArrowRight") movePlayer(1);
    });
}

function movePlayer(dir) {
    playerLane = Math.max(-1, Math.min(1, playerLane + dir));
}

function spawnEntity() {
    if (isGameOver) return;
    
    // إطارات المستشفى في الخلفية (سرير، محاليل)
    if (Math.random() > 0.9) {
        const decorEmoji = Math.random() > 0.5 ? '🛏️' : '🧪';
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: createEmojiTexture(decorEmoji) }));
        sprite.position.set(Math.random() > 0.5 ? -6.5 : 6.5, 1, -50);
        sprite.scale.set(2, 2, 1);
        scene.add(sprite);
        decorations.push(sprite);
    }

    // عوائق (فايروسات)
    if (Math.random() > 0.96) {
        const isBoost = Math.random() > 0.9;
        const emoji = isBoost ? '😷' : '🦠';
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: createEmojiTexture(emoji) }));
        sprite.position.set([-4, 0, 4][Math.floor(Math.random() * 3)], 1, -60);
        sprite.scale.set(isBoost ? 1.5 : 2, isBoost ? 1.5 : 2, 1);
        scene.add(sprite);
        if (isBoost) boosts.push(sprite); else obstacles.push(sprite);
    }
}

function animate() {
    if (isGameOver) return;
    requestAnimationFrame(animate);

    player.position.x = THREE.MathUtils.lerp(player.position.x, playerLane * 4, 0.15);
    spawnEntity();

    // حركة الديكورات
    decorations.forEach((d, i) => {
        d.position.z += speed;
        if (d.position.z > 15) { scene.remove(d); decorations.splice(i, 1); }
    });

    // حركة الفايروسات 🦠
    obstacles.forEach((o, i) => {
        o.position.z += speed;
        if (o.position.z > 8.5 && o.position.z < 11 && Math.abs(o.position.x - player.position.x) < 1.5) {
            if (hasShield) {
                hasShield = false;
                player.shield.visible = false;
                document.getElementById("shield-ui").style.display = "none";
                scene.remove(o); obstacles.splice(i, 1);
            } else {
                endGame("أصابتك العدوى 🦠!");
            }
        }
        if (o.position.z > 15) { scene.remove(o); obstacles.splice(i, 1); }
    });

    // حركة الكمامات 😷
    boosts.forEach((b, i) => {
        b.position.z += speed;
        if (b.position.z > 8.5 && b.position.z < 11 && Math.abs(b.position.x - player.position.x) < 1.5) {
            hasShield = true;
            player.shield.visible = true;
            document.getElementById("shield-ui").style.display = "block";
            scene.remove(b); boosts.splice(i, 1);
        }
        if (b.position.z > 15) { scene.remove(b); boosts.splice(i, 1); }
    });

    score++;
    speed += 0.00015;
    document.getElementById("score").innerText = "SCORE: " + score;
    renderer.render(scene, camera);
}

function endGame(msg) {
    isGameOver = true;
    alert(msg + "\nScore: " + score);
    location.reload();
}
</script>
</body>
</html>
